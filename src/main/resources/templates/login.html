<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RAG Chatbot — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root {
            --brand: #6366f1;
            --brand-dark: #4f46e5;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.25rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .brand-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            border-radius: 1rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; margin: 0 auto 1rem;
            box-shadow: 0 8px 20px rgba(99,102,241,0.4);
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--brand);
            color: #f1f5f9;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.25);
        }
        .form-control::placeholder { color: #64748b; }
        .form-label { color: #94a3b8; font-size: 0.875rem; }
        .btn-login {
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            border: none; border-radius: 0.75rem; padding: 0.75rem;
            font-weight: 600; letter-spacing: 0.025em;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(99,102,241,0.4);
        }
        .credentials-box {
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.25);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 1.5rem;
        }
        .cred-row { font-family: 'Courier New', monospace; font-size: 0.8rem; }
        h1, h2, h3, h4, h5, p, small, label { color: #e2e8f0; }
        .text-muted { color: #64748b !important; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-icon">🤖</div>
        <h4 class="fw-bold mb-1">RAG Chatbot</h4>
        <p class="text-muted small">Mainframe &amp; IBM Systems Knowledge Base</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 px-3 rounded-3 mb-3" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 px-3 rounded-3 mb-3" role="alert">
        <i class="bi bi-check-circle me-2"></i>You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0" style="border-color:rgba(255,255,255,0.15);color:#94a3b8;">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" id="username" name="username" class="form-control border-start-0"
                       placeholder="Enter username" required autofocus/>
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0" style="border-color:rgba(255,255,255,0.15);color:#94a3b8;">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" id="password" name="password" class="form-control border-start-0"
                       placeholder="Enter password" required/>
            </div>
        </div>
        <button type="submit" class="btn btn-login btn-primary w-100 text-white">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>

    <div class="credentials-box">
        <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i>Demo credentials:</p>
        <div class="cred-row text-success">admin / admin123 <span class="text-muted">(admin)</span></div>
        <div class="cred-row" style="color:#94a3b8;">user1 / password1</div>
        <div class="cred-row" style="color:#94a3b8;">demo / demo123</div>
    </div>
</div>
</body>
</html>

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=rag-chatbot

# ── Groq LLM (free at https://console.groq.com/keys) ────────────────────────
# Set via env var: GROQ_API_KEY=gsk_...
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}

# ── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.rag=INFO
logging.level.dev.langchain4j=WARN
